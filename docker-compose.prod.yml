services:
  # L'application Laravel (PHP-FPM)
  app_prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app_GS_PROD
    restart: always
    working_dir: /var/www
    env_file:
      - .env.prod  # Force l'utilisation du fichier de production
    volumes:
      - ./:/var/www
    networks:
      - laravel_prod

  # Le serveur Web Nginx
  nginx_prod:
    image: nginx:alpine
    container_name: laravel-nginx_GS_PROD
    restart: always
    ports:
      - "9000:80"  # Accès via http://localhost:9000 (différent de ton 8001 de dev)
    volumes:
      - ./:/var/www
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_prod
    depends_on:
      - app_prod

  # La base de données de Production
  db_prod:
    image: mysql:8.0
    container_name: laravel-db_GS_PROD
    restart: always
    environment:
      MYSQL_DATABASE: GestionStock_PROD # Base de données différente du dev
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata_prod:/var/lib/mysql # Volume séparé pour ne pas mélanger les données
    ports:
      - "3308:3306" # Port 3308 (car ton dev utilise déjà 3307)
    networks:
      - laravel_prod

networks:
  laravel_prod:
    driver: bridge

volumes:
  dbdata_prod:
    driver: local