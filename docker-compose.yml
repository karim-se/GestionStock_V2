services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app_GS_V2
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel
    ports:
      - "8000:80"    # Port pour ton site
       

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx_GS_V2
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel-db_GS_V2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: GestionStock_Docker_V2
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: laravel
      MYSQL_USER: laravel
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
    driver: local